openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Kodály Pathways API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: pathway
  - name: activities
  - name: lessons
  - name: classes
  - name: calendar
  - name: resources
  - name: dashboard
  - name: curriculum
  - name: site
  - name: admin
  - name: pages
  - name: microcopy
  - name: nav
  - name: media
  - name: Storage

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current logged in teacher
      responses:
        "200":
          description: Current user (or null)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthMeResponse" }

  /site-settings:
    get:
      operationId: getSiteSettings
      tags: [site]
      summary: Public site branding/settings (CMS)
      responses:
        "200":
          description: Site settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteSettings" }

  /admin/site-settings:
    put:
      operationId: updateSiteSettings
      tags: [admin]
      summary: Update site branding/settings (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteSettingsUpdate" }
      responses:
        "200":
          description: Updated site settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteSettings" }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — admin role required

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Demo login by email (creates teacher if missing)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Teacher" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout the current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard overview for the current teacher
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }

  /pathway/items:
    get:
      operationId: listPathwayItems
      tags: [pathway]
      summary: List Kodály progression items (default + custom)
      parameters:
        - in: query
          name: keyStage
          required: false
          schema: { type: string }
        - in: query
          name: strand
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Pathway items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PathwayItem" }
    post:
      operationId: createPathwayItem
      tags: [pathway]
      summary: Create a custom pathway item
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PathwayItemCreate" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PathwayItem" }

  /pathway/items/{id}:
    patch:
      operationId: updatePathwayItem
      tags: [pathway]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PathwayItemUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PathwayItem" }
    delete:
      operationId: deletePathwayItem
      tags: [pathway]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  /activities:
    get:
      operationId: listActivities
      tags: [activities]
      summary: List activities with filters
      parameters:
        - in: query
          name: keyStage
          required: false
          schema: { type: string }
        - in: query
          name: ageGroup
          required: false
          schema: { type: string }
        - in: query
          name: rhythmFocus
          required: false
          schema: { type: string }
        - in: query
          name: solfaFocus
          required: false
          schema: { type: string }
        - in: query
          name: activityType
          required: false
          schema: { type: string }
        - in: query
          name: difficulty
          required: false
          schema: { type: string }
        - in: query
          name: term
          required: false
          schema: { type: string }
        - in: query
          name: search
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Activities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Activity" }
    post:
      operationId: createActivity
      tags: [activities]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityCreate" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }

  /activities/{id}:
    get:
      operationId: getActivity
      tags: [activities]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
    patch:
      operationId: updateActivity
      tags: [activities]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
    delete:
      operationId: deleteActivity
      tags: [activities]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  /classes:
    get:
      operationId: listClasses
      tags: [classes]
      responses:
        "200":
          description: Classes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassRecord" }
    post:
      operationId: createClass
      tags: [classes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassCreate" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassRecord" }

  /classes/{id}:
    patch:
      operationId: updateClass
      tags: [classes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassRecord" }
    delete:
      operationId: deleteClass
      tags: [classes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  /lessons:
    get:
      operationId: listLessons
      tags: [lessons]
      parameters:
        - in: query
          name: classId
          required: false
          schema: { type: integer }
        - in: query
          name: term
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Lessons
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Lesson" }
    post:
      operationId: createLesson
      tags: [lessons]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LessonCreate" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }

  /lessons/{id}:
    get:
      operationId: getLesson
      tags: [lessons]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Lesson
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }
    patch:
      operationId: updateLesson
      tags: [lessons]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LessonUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }
    delete:
      operationId: deleteLesson
      tags: [lessons]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  /lessons/{id}/duplicate:
    post:
      operationId: duplicateLesson
      tags: [lessons]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DuplicateLessonRequest" }
      responses:
        "200":
          description: Duplicated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }

  /lessons/generate:
    post:
      operationId: generateLesson
      tags: [lessons]
      summary: Generate a lesson plan from inputs
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateLessonRequest" }
      responses:
        "200":
          description: Generated lesson
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }

  /lessons/{id}/pdf:
    get:
      operationId: downloadLessonPdf
      tags: [lessons]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /calendar:
    get:
      operationId: listCalendarEntries
      tags: [calendar]
      parameters:
        - in: query
          name: term
          required: false
          schema: { type: string }
        - in: query
          name: classId
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Calendar entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CalendarEntry" }
    post:
      operationId: createCalendarEntry
      tags: [calendar]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarEntryCreate" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarEntry" }

  /calendar/{id}:
    patch:
      operationId: updateCalendarEntry
      tags: [calendar]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarEntryUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarEntry" }
    delete:
      operationId: deleteCalendarEntry
      tags: [calendar]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  /calendar/copy-term:
    post:
      operationId: copyTerm
      tags: [calendar]
      summary: Copy all entries from one term to another
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopyTermRequest" }
      responses:
        "200":
          description: Copied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  /resources:
    get:
      operationId: listResources
      tags: [resources]
      parameters:
        - in: query
          name: search
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Resources
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Resource" }
    post:
      operationId: createResource
      tags: [resources]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceCreate" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resource" }

  /resources/import:
    post:
      operationId: importResource
      tags: [resources]
      summary: Import a resource from URL (fetches title and suggests metadata)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportResourceRequest" }
      responses:
        "200":
          description: Imported (preview, not yet saved)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResourcePreview" }

  /resources/{id}:
    patch:
      operationId: updateResource
      tags: [resources]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resource" }
    delete:
      operationId: deleteResource
      tags: [resources]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  /pages/{slug}:
    get:
      operationId: getPageBySlug
      tags: [pages]
      summary: Public — fetch a CMS page by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Page
          content: { application/json: { schema: { $ref: "#/components/schemas/Page" } } }
        "404":
          description: Not found

  /admin/pages:
    get:
      operationId: listPages
      tags: [pages, admin]
      summary: Admin — list all CMS pages
      responses:
        "200":
          description: Pages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PageSummary" }
    post:
      operationId: createPage
      tags: [pages, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PageCreate" }
      responses:
        "200":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Page" } } }

  /admin/pages/{id}:
    get:
      operationId: getPage
      tags: [pages, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Page
          content: { application/json: { schema: { $ref: "#/components/schemas/Page" } } }
    put:
      operationId: updatePage
      tags: [pages, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PageUpdate" }
      responses:
        "200":
          description: Updated
          content: { application/json: { schema: { $ref: "#/components/schemas/Page" } } }
    delete:
      operationId: deletePage
      tags: [pages, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } }

  /microcopy:
    get:
      operationId: getMicrocopy
      tags: [microcopy]
      summary: Public — fetch all microcopy strings as a key/value map
      responses:
        "200":
          description: Microcopy map
          content: { application/json: { schema: { $ref: "#/components/schemas/MicrocopyMap" } } }

  /admin/microcopy:
    get:
      operationId: listMicrocopy
      tags: [microcopy, admin]
      responses:
        "200":
          description: Microcopy entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MicrocopyEntry" }
    put:
      operationId: upsertMicrocopy
      tags: [microcopy, admin]
      summary: Bulk upsert microcopy entries
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MicrocopyUpsert" }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } }

  /nav:
    get:
      operationId: getNav
      tags: [nav]
      summary: Public — visible nav items grouped by location
      responses:
        "200":
          description: Nav
          content: { application/json: { schema: { $ref: "#/components/schemas/NavGroups" } } }

  /admin/nav:
    get:
      operationId: listNavItems
      tags: [nav, admin]
      responses:
        "200":
          description: Nav items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NavItem" }
    post:
      operationId: createNavItem
      tags: [nav, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NavItemCreate" }
      responses:
        "200":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/NavItem" } } }

  /admin/nav/{id}:
    put:
      operationId: updateNavItem
      tags: [nav, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NavItemUpdate" }
      responses:
        "200":
          description: Updated
          content: { application/json: { schema: { $ref: "#/components/schemas/NavItem" } } }
    delete:
      operationId: deleteNavItem
      tags: [nav, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } }

  /admin/nav/reorder:
    post:
      operationId: reorderNavItems
      tags: [nav, admin]
      summary: Persist a new sort order for a list of nav items
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NavReorder" }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } }

  /admin/media:
    get:
      operationId: listMedia
      tags: [media, admin]
      responses:
        "200":
          description: Media items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MediaItem" }
    post:
      operationId: registerMedia
      tags: [media, admin]
      summary: Register an uploaded object as a media library entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaCreate" }
      responses:
        "200":
          description: Registered
          content: { application/json: { schema: { $ref: "#/components/schemas/MediaItem" } } }

  /admin/media/{id}:
    put:
      operationId: updateMedia
      tags: [media, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaUpdate" }
      responses:
        "200":
          description: Updated
          content: { application/json: { schema: { $ref: "#/components/schemas/MediaItem" } } }
    delete:
      operationId: deleteMedia
      tags: [media, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } }

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
      responses:
        "200":
          description: Presigned upload URL generated.
          content: { application/json: { schema: { $ref: "#/components/schemas/UploadUrlResponse" } } }
        "400":
          description: Invalid input
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "500":
          description: Server error
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - in: path
          name: filePath
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object stream
          content: { "*/*": { schema: { type: string, format: binary } } }
        "404":
          description: Not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - in: path
          name: objectPath
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object stream
          content: { "*/*": { schema: { type: string, format: binary } } }
        "404":
          description: Not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  /curriculum/links:
    get:
      operationId: listCurriculumLinks
      tags: [curriculum]
      parameters:
        - in: query
          name: keyStage
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Curriculum links
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CurriculumLink" }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

