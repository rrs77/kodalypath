    # ----- CMS: Pages & blocks -----

    Block:
      description: |
        A renderable content block. Persisted as JSON; the renderer chooses
        the component by `type`. Validators on the server only check `type`
        and `props` shape — unknown types round-trip untouched so we can
        add block kinds without a migration.
      type: object
      properties:
        id: { type: string }
        type:
          type: string
          enum: [hero, heading, richText, image, columns, cta, featureGrid, videoEmbed, spacer]
        props:
          type: object
          additionalProperties: true
      required: [id, type, props]

    Page:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        published: { type: boolean }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/Block" }
        updatedAt: { type: string }
      required: [id, slug, title, published, blocks, updatedAt]

    PageSummary:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        published: { type: boolean }
        blockCount: { type: integer }
        updatedAt: { type: string }
      required: [id, slug, title, published, blockCount, updatedAt]

    PageCreate:
      type: object
      properties:
        slug: { type: string, minLength: 1, maxLength: 120, pattern: "^[a-z0-9-]+$" }
        title: { type: string, minLength: 1, maxLength: 240 }
        published: { type: boolean }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/Block" }
      required: [slug, title]

    PageUpdate:
      type: object
      properties:
        slug: { type: string, minLength: 1, maxLength: 120, pattern: "^[a-z0-9-]+$" }
        title: { type: string, minLength: 1, maxLength: 240 }
        published: { type: boolean }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/Block" }

    # ----- CMS: Microcopy -----

    MicrocopyMap:
      description: Flat key/value map of all microcopy strings.
      type: object
      additionalProperties: { type: string }

    MicrocopyEntry:
      type: object
      properties:
        key: { type: string }
        value: { type: string }
        description: { type: string }
        updatedAt: { type: string }
      required: [key, value, description, updatedAt]

    MicrocopyUpsert:
      type: object
      properties:
        entries:
          type: array
          items:
            type: object
            properties:
              key: { type: string, minLength: 1, maxLength: 120 }
              value: { type: string, maxLength: 4000 }
              description: { type: string, maxLength: 240 }
            required: [key, value]
        deleteKeys:
          type: array
          description: Keys to remove. Processed before upserts.
          items: { type: string, minLength: 1, maxLength: 120 }
      required: [entries]

    # ----- CMS: Navigation -----

    NavItem:
      type: object
      properties:
        id: { type: integer }
        location: { type: string }
        label: { type: string }
        href: { type: string }
        sortOrder: { type: integer }
        visible: { type: boolean }
      required: [id, location, label, href, sortOrder, visible]

    NavGroups:
      description: Visible nav items grouped by `location`.
      type: object
      additionalProperties:
        type: array
        items: { $ref: "#/components/schemas/NavItem" }

    NavItemCreate:
      type: object
      properties:
        location: { type: string, minLength: 1, maxLength: 32 }
        label: { type: string, minLength: 1, maxLength: 120 }
        href: { type: string, minLength: 1, maxLength: 2048 }
        sortOrder: { type: integer }
        visible: { type: boolean }
      required: [location, label, href]

    NavItemUpdate:
      type: object
      properties:
        location: { type: string, maxLength: 32 }
        label: { type: string, maxLength: 120 }
        href: { type: string, maxLength: 2048 }
        sortOrder: { type: integer }
        visible: { type: boolean }

    NavReorder:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              sortOrder: { type: integer }
            required: [id, sortOrder]
      required: [items]

    # ----- CMS: Media library -----

    MediaItem:
      type: object
      properties:
        id: { type: integer }
        objectPath: { type: string }
        url: { type: string }
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        alt: { type: string }
        createdAt: { type: string }
      required: [id, objectPath, url, fileName, mimeType, sizeBytes, alt, createdAt]

    MediaCreate:
      type: object
